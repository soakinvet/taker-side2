<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Taker Side</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        /* Kill WebView zoom + iOS auto-sizing + rubber-band scroll. */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        box-sizing: border-box;
      }
      #preview[hidden] { display: none; }
      #preview { width: min(100%, 576px); }
      #lens {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
        border-radius: 4px;
      }
      .preview-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .preview-actions button {
        flex: 1;
        background: #111;
        color: #e5e5e5;
        border: 1px solid #3d3d3d;
        border-radius: 8px;
        padding: 10px 8px;
        font: inherit;
      }
      .preview-note {
        color: #a3a3a3;
        margin: 8px 0 0;
      }
      #app {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .card {
        width: min(100%, 420px);
        text-align: left;
      }
      .kicker, .head, .feed, .fine, .help {
        color: #a3a3a3;
        margin: 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.03em;
        margin: 4px 0 8px;
      }
      .verdict {
        font-size: 40px;
        line-height: 1;
        margin: 8px 0;
        letter-spacing: -0.04em;
      }
      .detail {
        font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        margin: 0 0 12px;
        white-space: pre-wrap;
      }
      .action {
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid #6d6d6d;
        border-radius: 8px;
      }
      .feed, .fine { margin-top: 10px; }
      .help {
        margin: 12px 0 0;
        padding-left: 18px;
      }
      .help li { margin: 2px 0; }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="preview" hidden>
        <canvas id="lens" width="576" height="288"></canvas>
        <div class="preview-actions">
          <button type="button" id="tap-up">Up</button>
          <button type="button" id="tap-click">Click</button>
          <button type="button" id="tap-down">Down</button>
        </div>
        <p class="preview-note">This is the glasses screen, 576 by 288. Click joins or confirms. Up and Down change the coin, or cancel a confirm.</p>
      </div>
      <div id="app">Opening Taker Side…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
